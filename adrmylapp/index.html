<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0716"><title>Asistente de Reglas MyL</title>
<style>
:root{--a:#ffb347;--b:#ff3d7f;--bg:#120a24;--tx:#f4efff;--mu:#a9a2c4;--sf:#1a1330;--ok:#5dffa3;--md:#ffd24a;--no:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);font:16px/1.55 "Trebuchet MS",Verdana,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom));background:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--a) 35%,transparent),transparent 60%),radial-gradient(700px 500px at -10% 30%,color-mix(in srgb,var(--b) 28%,transparent),transparent 60%),var(--bg);background-attachment:fixed;transition:background .3s}
header{padding:18px 16px 4px;max-width:820px;margin:auto}
h1{margin:0;font:900 clamp(1.7rem,7vw,2.6rem)/1 Impact,"Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.02em;background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 small{display:block;font:600 .72rem "Trebuchet MS",sans-serif;letter-spacing:.18em;color:var(--mu);margin-top:6px;-webkit-text-fill-color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(10,7,22,.88);backdrop-filter:blur(14px);border-top:1px solid #ffffff22}
nav button{flex:0 0 auto;min-width:64px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid #ffffff1c;background:#ffffff0d;color:var(--mu);border-radius:16px;font:600 .66rem inherit;cursor:pointer;padding:4px 8px}
nav button i{font-style:normal;font-size:1.3rem;line-height:1}
nav button.on{background:linear-gradient(135deg,var(--a),var(--b));color:#10061c;border-color:transparent;font-weight:800}
main{max-width:820px;margin:auto;padding:10px 14px}
.card{background:linear-gradient(var(--sf),var(--sf)) padding-box,linear-gradient(135deg,var(--a),var(--b)) border-box;border:1.5px solid transparent;border-radius:18px;padding:14px 16px;margin:12px 0;box-shadow:0 8px 30px #0006}
.hero{margin:10px 0;padding:22px 18px;border-radius:24px;background:linear-gradient(135deg,var(--a),var(--b));color:#14061c;clip-path:polygon(0 0,100% 0,100% 88%,94% 100%,0 100%)}
.hero small{letter-spacing:.2em;font-weight:800;opacity:.7}.hero b{display:block;font:900 clamp(1.4rem,6vw,2rem)/1.1 Impact,"Arial Black",sans-serif;text-transform:uppercase;margin:6px 0}.hero span{font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}@media(min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{min-height:92px;border:0;border-radius:18px;background:linear-gradient(145deg,var(--a),var(--b));color:#14061c;font:800 .95rem inherit;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:12px;text-align:left}.tile i{font-style:normal;font-size:1.7rem}
input,textarea,select{width:100%;min-height:48px;padding:11px 12px;border-radius:14px;border:1.5px solid #ffffff2e;background:#0b0718aa;color:var(--tx);font:inherit;margin:5px 0}textarea{min-height:96px}input:focus,textarea:focus,select:focus{outline:2px solid var(--a)}
.btn{min-height:48px;padding:0 18px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--b));color:#14061c;font:800 1rem inherit;cursor:pointer;margin:5px 6px 5px 0;display:inline-flex;align-items:center}.btn.s{background:#ffffff12;color:var(--tx);border:1.5px solid #ffffff2e}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid #ffffff33;margin:0 4px 2px 0;color:var(--mu)}.alto{color:var(--ok);border-color:var(--ok)}.medio{color:var(--md);border-color:var(--md)}.insuf{color:var(--no);border-color:var(--no)}
.mu{color:var(--mu);font-size:.88rem}a{color:var(--a)}h2{font:800 1.05rem inherit;text-transform:uppercase;letter-spacing:.06em;color:var(--a);margin:.5em 0 .3em}li{margin:.5em 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
</style></head><body>
<header><h1>Asistente de Reglas MyL<small>MITOS Y LEYENDAS · PRIMER BLOQUE</small></h1></header>
<main id="v"></main><nav id="nav"></nav>
<script src="data.js"></script><script src="app.js"></script></body></html>
